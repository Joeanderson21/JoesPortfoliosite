name: CI

# Checks only. The site itself is published by GitHub Pages
# (pages-build-deployment) whenever main changes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate HTML
        run: |
          pip install html5validator==0.4.2
          html5validator --root . --ignore .claude

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --offline --include-fragments './*.html'
          fail: true
