<body>

      </nav>
    </div>

  <main id="main">
    <section class="container">
      <h1>Contact</h1>
      <p class="muted">Questions about child care, real estate, or working together? Send a message and it opens in your email app.</p>

      <div class="spacer-sm"></div>

      <div class="card">
        <form id="contactForm" aria-label="Contact form">
          <div class="form-row">
            <div class="field">
              <label class="field-label" for="name">Your name</label>
              <input class="form-control" id="name" type="text" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label class="field-label" for="email">Your email</label>
              <input class="form-control" id="email" type="email" name="email" autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="subject">Subject</label>
            <input class="form-control" id="subject" type="text" name="subject" required>
          </div>

          <div class="field">
            <label class="field-label" for="message">Message</label>
            <textarea class="form-control" id="message" name="message" required></textarea>
          </div>

          <div class="form-actions">
            <button class="btn primary" type="submit">Open in email app</button>
            <!-- status text updated by script.js -->
            <div data-form-status role="status" aria-live="polite" class="form-status"></div>
          </div>
        </form>
      </div>

      <div class="spacer-sm"></div>

      <p class="muted">Or email me at: <a href="mailto:Joeanderson21@gmail.com">Joeanderson21@gmail.com</a> or find me on <a href="https://www.linkedin.com/in/joseph-john-anderson-252a8523/" target="_blank" rel="noopener">LinkedIn</a></p>
    </section>
  </main>

  <footer>
    <div class="container">
      <small class="muted">© <span id="year"></span> Joe Anderson</small>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
